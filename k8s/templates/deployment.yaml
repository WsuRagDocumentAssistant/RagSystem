apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-server
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: rag-server
  template:
    metadata:
      labels:
        app: rag-server
    spec:
      {{- if .Values.image.pullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecretName }}
      {{- end }}
      containers:
        - name: rag-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          {{- if .Values.gpu.enabled }}
          resources:
            limits:
              nvidia.com/gpu: {{ .Values.gpu.count }}
          {{- end }}
          envFrom:
            {{- range .Values.envFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
            {{- end }}
          {{- if .Values.logs.enabled }}
          volumeMounts:
            - name: logs
              mountPath: {{ .Values.logs.mountPath }}
            - name: storage
              mountPath: {{ .Values.storage.documentMountPath }}
              subPath: documents
            - name: storage
              mountPath: {{ .Values.storage.imageMountPath }}
              subPath: images
          {{- end }}
      {{- if .Values.logs.enabled }}
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: {{ .Values.logs.pvcName }}
        - name: storage
          persistentVolumeClaim:
            claimName: {{ .Values.storage.pvcName }}
      {{- end }}
